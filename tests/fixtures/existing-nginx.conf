load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes 8;
worker_rlimit_nofile 4096;
events { worker_connections 4096; }
stream {
 upstream wireguard-servers {
  hash $remote_addr consistent;
  server 192.168.1.2:51900;
  server 192.168.1.150:51900;
 }
 server {
  listen 51900 udp;
  proxy_pass wireguard-servers;
  proxy_responses 1;
  proxy_bind $remote_addr transparent;
  proxy_timeout 1m;
  proxy_connect_timeout 2s;
  error_log /var/log/wg_error.log;
 }
 upstream dns-servers {
  server 192.168.1.233:53;
  server 192.168.1.150:53;
 }
 server {
  listen 127.0.0.1:53 reuseport;
  listen 127.0.0.1:53 udp reuseport;
  proxy_pass 127.0.0.1:54;
 }
 server {
  listen 0.0.0.0:53 reuseport;
  listen 0.0.0.0:53 udp reuseport;
  proxy_pass dns-servers;
  proxy_responses 1;
  proxy_bind $remote_addr transparent;
  proxy_timeout 1m;
  proxy_connect_timeout 2s;
  error_log /var/log/dns_error.log;
 }
 upstream dns6-servers {
  server [fd5d:90b1:e01e::233]:53;
  server [fd5d:90b1:e01e::150]:53;
 }
 server {
  listen [::1]:53 reuseport;
  listen [::1]:53 udp reuseport;
  proxy_pass [::1]:54;
 }
 server {
  listen [::0]:53 reuseport;
  listen [::0]:53 udp reuseport;
  proxy_pass dns6-servers;
  proxy_responses 1;
  proxy_bind $remote_addr transparent;
  proxy_timeout 1m;
  proxy_connect_timeout 2s;
  error_log /var/log/dns_error.log;
 }
}
